    <!-- No og:image / twitter:image on purpose: public/social-preview.jpg does
         not exist, and pointing at a missing file makes some platforms render a
         broken card. Add a 1200x630 image there, then restore the four tags. -->
    <meta name="twitter:card" content="summary" />

      name="twitter:title"
      content="Mohammed Mahyoub — ITS, Systems Integration & Applied AI"

    <link rel="preconnect" href="https://fonts.googleapis.com" />

      rel="stylesheet"
    />
    <title>Mohammed Mahyoub | ITS & Systems Integration Engineer</title>
    <script>
      try {
        var stored = localStorage.getItem('portfolio-theme')
        if (stored !== 'light') document.documentElement.classList.add('dark')
      } catch (e) {
        document.documentElement.classList.add('dark')
      }
    </script>
    <script>
      // Decode the deep-link path encoded by public/404.html on GitHub Pages
      // (as ?p=/path&q=querystring) and restore it via history.replaceState
      // before React Router mounts.
      ;(function (l) {
        var params = new URLSearchParams(l.search)
        var p = params.get('p')
        if (p) {
          var q = params.get('q')
          var restoredSearch = q ? '?' + q.replace(/~and~/g, '&') : ''
          window.history.replaceState(
            null,
            '',
            l.pathname.replace(/\/$/, '') + p + restoredSearch + l.hash,
          )
        }
      })(window.location)
    </script>
  </head>

  </body>
