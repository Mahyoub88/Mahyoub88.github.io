<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" role="img" aria-labelledby="title desc"><title id="title">Monitoring Console — Workflow</title><desc id="desc">Read numbered steps in order. Branches and retry conditions are explained in the page text.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#67e8d0"/></marker></defs><rect width="960" height="600" rx="20" fill="#0b1220"/><g font-family="Arial,sans-serif"><text x="40" y="48" font-size="24" fill="#f8fafc">Monitoring Console — Workflow</text><text x="40" y="78" font-size="14" fill="#a9bdd3">PROPOSED DESIGN · Not recovered application source</text><path d="M450 150 H492" fill="none" stroke="#67e8d0" stroke-width="2" marker-end="url(#arrow)"/><path d="M705 200 V225 H245 V242" fill="none" stroke="#67e8d0" stroke-width="2" marker-end="url(#arrow)"/><path d="M450 300 H492" fill="none" stroke="#67e8d0" stroke-width="2" marker-end="url(#arrow)"/><path d="M705 350 V375 H245 V392" fill="none" stroke="#67e8d0" stroke-width="2" marker-end="url(#arrow)"/><path d="M450 450 H492" fill="none" stroke="#67e8d0" stroke-width="2" marker-end="url(#arrow)"/><rect x="40" y="100" width="410" height="100" rx="12" fill="#172c43" stroke="#52718a"/><text x="58" y="136" font-size="19" fill="#67e8d0">Register equipment</text><text x="58" y="170" font-size="14" fill="#d7e3f3">Site, device and check configuration</text><rect x="500" y="100" width="410" height="100" rx="12" fill="#172c43" stroke="#52718a"/><text x="518" y="136" font-size="19" fill="#67e8d0">Collect in background</text><text x="518" y="170" font-size="14" fill="#d7e3f3">Time-limited check with timestamp</text><rect x="40" y="250" width="410" height="100" rx="12" fill="#172c43" stroke="#52718a"/><text x="58" y="286" font-size="19" fill="#67e8d0">Evaluate result</text><text x="58" y="320" font-size="14" fill="#d7e3f3">Separate failure from unavailable data</text><rect x="500" y="250" width="410" height="100" rx="12" fill="#172c43" stroke="#52718a"/><text x="518" y="286" font-size="19" fill="#67e8d0">Detect state transition</text><text x="518" y="320" font-size="14" fill="#d7e3f3">Persist event; avoid repeated alerts</text><rect x="40" y="400" width="410" height="100" rx="12" fill="#172c43" stroke="#52718a"/><text x="58" y="436" font-size="19" fill="#67e8d0">Investigate incident</text><text x="58" y="470" font-size="14" fill="#d7e3f3">Record diagnosis and actions</text><rect x="500" y="400" width="410" height="100" rx="12" fill="#172c43" stroke="#52718a"/><text x="518" y="436" font-size="19" fill="#67e8d0">Confirm recovery</text><text x="518" y="470" font-size="14" fill="#d7e3f3">Stable recovery, then close and report</text><text x="40" y="580" font-size="13" fill="#a9bdd3">Read numbered steps in order. Branches and retry conditions are explained in the page text.</text></g></svg>