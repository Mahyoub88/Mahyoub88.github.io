<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 560" role="img" aria-labelledby="t d"><title id="t">MTN relay site: mast and solar power</title><desc id="d">Sketch of the relay mast with two dishes and the solar power chain feeding two radios, with the sizing results from the design calculation. Design proposal.</desc><defs><marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9z" fill="#b7c0d4"/></marker></defs><rect width="1180" height="560" rx="18" fill="#0a0e18"/><g font-family="Arial,sans-serif"><text x="40" y="40" fill="#5b9dff" font-size="15">EXPLANATORY DIAGRAM · DESIGN PROPOSAL, NOT AN AS-BUILT DRAWING</text><text x="40" y="74" fill="#f5f7fb" font-size="26">MTN relay site: mast and solar power</text><rect x="130" y="150" width="14" height="300" fill="#2c4468"/><rect x="60" y="440" width="150" height="14" rx="4" fill="#2c4468"/><ellipse cx="86" cy="190" rx="14" ry="42" fill="#121828" stroke="#5b9dff" stroke-width="3" transform="rotate(-4 86 190)"/><text x="40" y="262" fill="#5b9dff" font-size="15">Hop 1 dish</text><ellipse cx="190" cy="250" rx="16" ry="56" fill="#121828" stroke="#22d3a6" stroke-width="3" transform="rotate(5 190 250)"/><text x="150" y="332" fill="#22d3a6" font-size="15">Hop 2 dish</text><text x="60" y="480" fill="#b7c0d4" font-size="15">10-15 m mast · grounded</text><rect x="330" y="120" width="560" height="58" rx="12" fill="#121828" stroke="#f5b83d" stroke-width="2"/><text x="346" y="146" fill="#f5f7fb" font-size="19" font-weight="700">Solar array</text><text x="346" y="168" fill="#b7c0d4" font-size="15">201 W recommended</text><line x1="610" y1="178" x2="610" y2="190" stroke="#b7c0d4" stroke-width="3" marker-end="url(#a)"/><rect x="330" y="190" width="560" height="58" rx="12" fill="#121828" stroke="#f5b83d" stroke-width="2"/><text x="346" y="216" fill="#f5f7fb" font-size="19" font-weight="700">MPPT regulator</text><text x="346" y="238" fill="#b7c0d4" font-size="15">about 21 A, 12 V</text><line x1="610" y1="248" x2="610" y2="260" stroke="#b7c0d4" stroke-width="3" marker-end="url(#a)"/><rect x="330" y="260" width="560" height="58" rx="12" fill="#121828" stroke="#f5b83d" stroke-width="2"/><text x="346" y="286" fill="#f5f7fb" font-size="19" font-weight="700">Battery bank</text><text x="346" y="308" fill="#b7c0d4" font-size="15">155 Ah LiFePO4 or 248 Ah lead-acid</text><line x1="610" y1="318" x2="610" y2="330" stroke="#b7c0d4" stroke-width="3" marker-end="url(#a)"/><rect x="330" y="330" width="560" height="58" rx="12" fill="#121828" stroke="#5b9dff" stroke-width="2"/><text x="346" y="356" fill="#f5f7fb" font-size="19" font-weight="700">PoE injectors</text><text x="346" y="378" fill="#b7c0d4" font-size="15">two radios, 24 V PoE</text><line x1="610" y1="388" x2="610" y2="400" stroke="#b7c0d4" stroke-width="3" marker-end="url(#a)"/><rect x="330" y="400" width="560" height="58" rx="12" fill="#121828" stroke="#22d3a6" stroke-width="2"/><text x="346" y="426" fill="#f5f7fb" font-size="19" font-weight="700">Radios</text><text x="346" y="448" fill="#b7c0d4" font-size="15">load about 18 W</text><text x="330" y="500" fill="#b7c0d4" font-size="15">Design basis: 422 Wh per day, 3 days of autonomy, 4.5 peak sun hours, 70% system efficiency.</text><text x="330" y="526" fill="#b7c0d4" font-size="15">Surge protection on every Ethernet run; one earth electrode shared by the mast, the array and the cabinet.</text></g></svg>
