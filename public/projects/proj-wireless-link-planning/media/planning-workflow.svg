<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 660" role="img" aria-labelledby="t d"><title id="t">Wireless link planning: from coverage need to a documented link decision</title><desc id="d">Explanatory workflow. Coverage, path clearance and link budget are reviewed separately and combined into one decision record, then validated in the field. Not an as-built drawing or a test result.</desc><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto-start-reverse"><path d="M0 0 L7 3 L0 6" fill="#5b9dff"/></marker></defs><rect width="1240" height="660" rx="18" fill="#0a0e18"/><g font-family="Arial,sans-serif"><text x="40" y="48" fill="#5b9dff" font-size="17">ENGINEERING EXPLANATION</text><text x="40" y="91" fill="#f5f7fb" font-size="29">From coverage need to a documented link decision</text>
<rect x="40" y="140" width="270" height="130" rx="12" fill="#121828" stroke="#5b9dff"/><text x="56" y="176" fill="#f5f7fb" font-size="21">1 · Coverage and sites</text><text x="56" y="206" fill="#b7c0d4" font-size="16">Where is service needed?</text><text x="56" y="232" fill="#b7c0d4" font-size="16">Sectors, antenna placement</text>
<rect x="350" y="140" width="270" height="130" rx="12" fill="#121828" stroke="#5b9dff"/><text x="366" y="176" fill="#f5f7fb" font-size="21">2 · Path clearance</text><text x="366" y="206" fill="#b7c0d4" font-size="16">Does the path stay clear?</text><text x="366" y="232" fill="#b7c0d4" font-size="16">LOS, Fresnel radius, profile</text>
<rect x="660" y="140" width="270" height="130" rx="12" fill="#121828" stroke="#5b9dff"/><text x="676" y="176" fill="#f5f7fb" font-size="21">3 · Link budget</text><text x="676" y="206" fill="#b7c0d4" font-size="16">Is there margin at the receiver?</text><text x="676" y="232" fill="#b7c0d4" font-size="16">Pt + Gt + Gr − L vs sensitivity</text>
<rect x="970" y="140" width="230" height="130" rx="12" fill="#121828" stroke="#5b9dff"/><text x="986" y="176" fill="#f5f7fb" font-size="21">4 · Capacity</text><text x="986" y="206" fill="#b7c0d4" font-size="16">Can it carry the load?</text><text x="986" y="232" fill="#b7c0d4" font-size="16">Offered load, direction</text>
<path d="M175 270 L175 340 L620 340" fill="none" stroke="#5b9dff" stroke-width="3"/><path d="M485 270 L485 340" fill="none" stroke="#5b9dff" stroke-width="3"/><path d="M795 270 L795 340 L620 340" fill="none" stroke="#5b9dff" stroke-width="3"/><path d="M1085 270 L1085 340 L620 340" fill="none" stroke="#5b9dff" stroke-width="3"/><path d="M620 340 L620 385" fill="none" stroke="#5b9dff" stroke-width="3" marker-end="url(#a)"/>
<rect x="320" y="385" width="600" height="95" rx="12" fill="#121828" stroke="#5b9dff" stroke-width="2"/><text x="340" y="425" fill="#f5f7fb" font-size="22">Link decision record</text><text x="340" y="455" fill="#b7c0d4" font-size="16">Inputs, units, assumptions and the criterion applied to each result</text>
<path d="M620 480 L620 520" fill="none" stroke="#5b9dff" stroke-width="3" marker-end="url(#a)"/>
<rect x="320" y="520" width="600" height="60" rx="12" fill="#121828" stroke="#5b9dff"/><text x="340" y="558" fill="#f5f7fb" font-size="19">Alignment and field validation · measurements kept separate from predictions</text>
<text x="40" y="625" fill="#b7c0d4" font-size="16">Authored documentation visual · Illustrative review model, not original implementation evidence</text></g></svg>
