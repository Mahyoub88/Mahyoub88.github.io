fill="none" stroke="#5b9dff" stroke-width="3"  marker-end="url(#a)"/><text x="55" y="455" fill="#f5f7fb" font-size="22">FSPL = 32.44 + 20 log10(f MHz) + 20 log10(d km)</text><text x="55" y="505" fill="#b7c0d4" font-size="22">Illustrative sensitivity: −75 dBm</text><text x="55" y="551" fill="#5b9dff" font-size="24">Nominal margin: −54.44 − (−75) = 20.56 dB</text><text x="40" y="624" fill="#b7c0d4" font-size="17">Authored documentation visual · Illustrative review model, not original implementation evidence</text></g></svg>