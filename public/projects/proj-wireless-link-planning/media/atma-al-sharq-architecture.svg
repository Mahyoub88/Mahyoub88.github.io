<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1260 500" role="img" aria-labelledby="t d"><title id="t">Network architecture: Atma to Al-Sharq</title><desc id="d">Block diagram of the two-hop backhaul through the MTN tower site and the seven distribution zones in Al-Sharq. Design proposal.</desc><defs><marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9z" fill="#b7c0d4"/></marker></defs><rect width="1260" height="500" rx="18" fill="#0a0e18"/><g font-family="Arial,sans-serif"><text x="40" y="40" fill="#5b9dff" font-size="15">EXPLANATORY DIAGRAM · DESIGN PROPOSAL, NOT AN AS-BUILT DRAWING</text><text x="40" y="74" fill="#f5f7fb" font-size="26">Network architecture: Atma to Al-Sharq</text><rect x="40" y="130" width="230" height="150" rx="12" fill="#121828" stroke="#5b9dff" stroke-width="2"/><text x="56" y="162" fill="#f5f7fb" font-size="19" font-weight="700">Atma centre</text><text x="56" y="188" fill="#b7c0d4" font-size="15">Internet source</text><text x="56" y="210" fill="#b7c0d4" font-size="15">Netgear modems per line</text><text x="56" y="232" fill="#b7c0d4" font-size="15">RB 750 combines lines</text><text x="56" y="254" fill="#b7c0d4" font-size="15">PowerBeam M5 400</text><rect x="340" y="130" width="250" height="150" rx="12" fill="#121828" stroke="#f5b83d" stroke-width="2"/><text x="356" y="162" fill="#f5f7fb" font-size="19" font-weight="700">MTN tower site</text><text x="356" y="188" fill="#b7c0d4" font-size="15">Mountain-top relay, 2680 m</text><text x="356" y="210" fill="#b7c0d4" font-size="15">PowerBeam + Rocket M5</text><text x="356" y="232" fill="#b7c0d4" font-size="15">Solar, battery, regulator</text><text x="356" y="254" fill="#b7c0d4" font-size="15">Lightning protection</text><rect x="660" y="130" width="250" height="150" rx="12" fill="#121828" stroke="#22d3a6" stroke-width="2"/><text x="676" y="162" fill="#f5f7fb" font-size="19" font-weight="700">Al-Sharq core</text><text x="676" y="188" fill="#b7c0d4" font-size="15">Rocket Dish M5 34 dBi</text><text x="676" y="210" fill="#b7c0d4" font-size="15">MikroTik RB AH 1100</text><text x="676" y="232" fill="#b7c0d4" font-size="15">Switching and routing</text><text x="676" y="254" fill="#b7c0d4" font-size="15">Management VLAN</text><line x1="270" y1="205" x2="340" y2="205" stroke="#5b9dff" stroke-width="3" marker-end="url(#a)"/><line x1="590" y1="205" x2="660" y2="205" stroke="#22d3a6" stroke-width="3" marker-end="url(#a)"/><text x="305" y="312" fill="#5b9dff" font-size="15" text-anchor="middle">Hop 1 · 8.3 km</text><text x="625" y="312" fill="#22d3a6" font-size="15" text-anchor="middle">Hop 2 · 15.6 km</text><line x1="910" y1="205" x2="960" y2="205" stroke="#22d3a6" stroke-width="3" marker-end="url(#a)"/><rect x="960" y="110" width="260" height="360" rx="14" fill="none" stroke="#2c4468" stroke-dasharray="6 5"/><text x="976" y="138" fill="#f5f7fb" font-size="18" font-weight="700">Distribution zones</text><rect x="974" y="155" width="232" height="86" rx="10" fill="#121828" stroke="#22d3a6"/><text x="988" y="185" fill="#f5f7fb" font-size="17" font-weight="700">Zone 1</text><text x="988" y="211" fill="#b7c0d4" font-size="14">2 NanoStation + 15 dBi sector</text><text x="988" y="231" fill="#b7c0d4" font-size="13">about 500 m planned range</text><rect x="974" y="255" width="232" height="86" rx="10" fill="#121828" stroke="#22d3a6"/><text x="988" y="285" fill="#f5f7fb" font-size="17" font-weight="700">Zones 4, 6, 12, 14</text><text x="988" y="311" fill="#b7c0d4" font-size="14">PowerBeam + 2 NanoStation each</text><text x="988" y="331" fill="#b7c0d4" font-size="13">about 500 m planned range</text><rect x="974" y="355" width="232" height="86" rx="10" fill="#121828" stroke="#22d3a6"/><text x="988" y="385" fill="#f5f7fb" font-size="17" font-weight="700">Zones 10, 13</text><text x="988" y="411" fill="#b7c0d4" font-size="14">PowerBeam + 3 NanoStation each</text><text x="988" y="431" fill="#b7c0d4" font-size="13">about 500 m planned range</text><text x="40" y="400" fill="#b7c0d4" font-size="17">Backhaul carries one shared ceiling of about 65 Mbps at 20 MHz (assumption).</text><text x="40" y="430" fill="#b7c0d4" font-size="17">Hop 2 masts of 10 to 15 m and a dish tilted about -5 degrees (simulation result).</text><text x="40" y="460" fill="#b7c0d4" font-size="17">Separate management, transport and subscriber VLANs; routing and queues at the core.</text></g></svg>
