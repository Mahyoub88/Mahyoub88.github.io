<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 830" role="img" aria-labelledby="title desc">
<title id="title">SANY and CNCRT share the jxc production database</title><desc id="desc">Both PC applications use ADO/SQLOLEDB to access SQL Server jxc. Application tables are grouped by function. Connections to the groups are conceptual, not recovered foreign-key relationships. PLC and serial weighing communication stay separate from database storage.</desc>
<defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse"><path d="M0 0L8 4L0 8Z" fill="#176d79"/></marker></defs>
<rect width="1160" height="830" rx="20" fill="#f8fafc"/>
<g font-family="Arial, sans-serif" fill="#16324b">
<text x="40" y="48" font-size="28" font-weight="700">TWO APPLICATIONS · ONE PRODUCTION DATABASE</text>
<text x="40" y="78" font-size="17">Recorded application roles and exported schema, grouped for explanation.</text>
<rect x="40" y="112" width="500" height="130" rx="14" fill="#e6f4f1" stroke="#177466" stroke-width="2"/>
<text x="65" y="148" font-size="25" font-weight="700">sany.exe / sany9.exe</text>
<text x="65" y="180" font-size="19">Operational HMI · batching · weighing</text>
<text x="65" y="211" font-size="17">PLC commands/status + separate serial weighing</text>
<rect x="620" y="112" width="500" height="130" rx="14" fill="#e7effb" stroke="#35618b" stroke-width="2"/>
<text x="645" y="148" font-size="25" font-weight="700">cncrt.exe</text>
<text x="645" y="180" font-size="19">Recipes · orders · deliveries · reporting</text>
<text x="645" y="211" font-size="17">Production-management views and records</text>
<path d="M290 247V278H470V306M870 247V278H690V306" fill="none" stroke="#176d79" stroke-width="3" marker-start="url(#a)" marker-end="url(#a)"/>
<rect x="356" y="306" width="448" height="116" rx="16" fill="#fff" stroke="#176d79" stroke-width="2"/>
<text x="382" y="345" font-size="26" font-weight="700">SQL Server 2000 · jxc</text>
<text x="382" y="377" font-size="18">Shared access through ADO / SQLOLEDB</text>
<text x="382" y="404" font-size="17">35 application tables in exported schema</text>
<path d="M580 422V449M195 460V449H965V460M580 449V460" fill="none" stroke="#91a6b7" stroke-width="2" stroke-dasharray="6 6"/>
<g fill="#fff" stroke="#bdcddd"><rect x="40" y="465" width="340" height="126" rx="12"/><rect x="410" y="465" width="340" height="126" rx="12"/><rect x="780" y="465" width="340" height="126" rx="12"/><rect x="40" y="616" width="340" height="126" rx="12"/><rect x="410" y="616" width="340" height="126" rx="12"/><rect x="780" y="616" width="340" height="126" rx="12"/></g>
<text x="60" y="497" font-size="20" font-weight="700">Recipes &amp; batches</text><text x="60" y="527" font-size="18">recipe · manufacture</text><text x="60" y="556" font-size="16">Material targets and actual quantities</text>
<text x="430" y="497" font-size="20" font-weight="700">Orders &amp; delivery</text><text x="430" y="527" font-size="18">Task · Orders · OrderDetail</text><text x="430" y="556" font-size="18">OutMaster</text>
<text x="800" y="497" font-size="20" font-weight="700">Weighing configuration</text><text x="800" y="527" font-size="18">exactitude · fall · adjcfg</text><text x="800" y="556" font-size="16">Tolerance · compensation · adjustment</text>
<text x="60" y="648" font-size="20" font-weight="700">Materials &amp; inventory</text><text x="60" y="678" font-size="18">products · stock</text><text x="60" y="707" font-size="16">Material and stock-related records</text>
<text x="430" y="648" font-size="20" font-weight="700">Plant information</text><text x="430" y="678" font-size="18">Station</text><text x="430" y="707" font-size="16">Station metadata in retained database</text>
<text x="800" y="648" font-size="20" font-weight="700">Events &amp; history</text><text x="800" y="678" font-size="18">Alarm · LogInfo</text><text x="800" y="707" font-size="16">Alarm and activity records</text>
<text x="40" y="780" font-size="16">Functional grouping only: no SQL foreign-key relationships are asserted by this diagram.</text>
<text x="40" y="808" font-size="16">Database records document production; they are separate from real-time PLC and weighing communication.</text>
</g></svg>
