<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" width="1200" height="720" fill="#1d2733" role="img" aria-label="Alarm management">
<title>Alarm management</title>
<defs><style>text{font-family:'Segoe UI', Helvetica, Arial, 'Liberation Sans', sans-serif}.m{font-family:Consolas, 'DejaVu Sans Mono', monospace}</style><marker id="k1f3a5f" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f3a5f"/></marker><marker id="k0b7a83" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0b7a83"/></marker><marker id="kb86e00" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b86e00"/></marker><marker id="kb3261e" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b3261e"/></marker><marker id="k2e7d4f" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e7d4f"/></marker><marker id="k5b6b7c" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5b6b7c"/></marker><marker id="k1d2733" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1d2733"/></marker></defs>
<rect width="1200" height="720" fill="#ffffff"/>
<rect x="0" y="0" width="1200" height="6" fill="#1f3a5f"/>
<text x="40" y="52" font-size="26" font-weight="700">Alarm management</text>
<text x="40" y="80" font-size="15" fill="#5b6b7c">How an alarm is raised, acknowledged and cleared, and how it is prioritised</text>
<rect x="80" y="150" width="280" height="90" rx="8" fill="#e6f3ea" stroke="#2e7d4f" stroke-width="1.5"/>
<text x="94" y="176" font-size="15" fill="#2e7d4f" font-weight="700">Normal</text>
<text x="94" y="200.9" font-size="13">no alarm</text>
<rect x="460" y="150" width="280" height="90" rx="8" fill="#fbe9e7" stroke="#b3261e" stroke-width="1.5"/>
<text x="474" y="176" font-size="15" fill="#b3261e" font-weight="700">Active, unacknowledged</text>
<text x="474" y="200.9" font-size="13">flashing, horn on</text>
<rect x="840" y="150" width="280" height="90" rx="8" fill="#fbf1e1" stroke="#b86e00" stroke-width="1.5"/>
<text x="854" y="176" font-size="15" fill="#b86e00" font-weight="700">Active, acknowledged</text>
<text x="854" y="200.9" font-size="13">steady, horn off</text>
<rect x="460" y="330" width="280" height="90" rx="8" fill="#e3f3f4" stroke="#0b7a83" stroke-width="1.5"/>
<text x="474" y="356" font-size="15" fill="#0b7a83" font-weight="700">Cleared, unacknowledged</text>
<text x="474" y="380.9" font-size="13">operator still to confirm</text>
<line x1="362" y1="195" x2="456" y2="195" stroke="#b3261e" stroke-width="2" marker-end="url(#kb3261e)"/>
<text x="409" y="185" font-size="13" fill="#b3261e" font-weight="600" text-anchor="middle">occurs</text>
<line x1="742" y1="195" x2="836" y2="195" stroke="#b86e00" stroke-width="2" marker-end="url(#kb86e00)"/>
<text x="789" y="185" font-size="13" fill="#b86e00" font-weight="600" text-anchor="middle">ACK</text>
<path d="M 980 242 V 375 H 744" fill="none" stroke="#0b7a83" stroke-width="1.8" marker-end="url(#k0b7a83)"/>
<text x="990" y="310" font-size="12.5" fill="#0b7a83" font-weight="700">condition clears</text>
<path d="M 600 242 V 326" fill="none" stroke="#0b7a83" stroke-width="1.6" stroke-dasharray="6 4" marker-end="url(#k0b7a83)"/>
<text x="612" y="290" font-size="12" fill="#0b7a83" font-weight="600">clears before ACK</text>
<path d="M 456 375 H 220 V 244" fill="none" stroke="#2e7d4f" stroke-width="1.8" marker-end="url(#k2e7d4f)"/>
<text x="330" y="366" font-size="12.5" fill="#2e7d4f" font-weight="700" text-anchor="middle">operator ACK</text>
<text x="40" y="470" font-size="16" fill="#1f3a5f" font-weight="700">Priorities</text>
<rect x="40" y="486" width="1120" height="42" rx="6" fill="#ffffff" stroke="#b3261e" stroke-width="1.3"/>
<rect x="40" y="486" width="110" height="42" rx="6" fill="#b3261e" stroke="#b3261e" stroke-width="0"/>
<text x="95" y="513" font-size="14" fill="#ffffff" font-weight="700" text-anchor="middle">High</text>
<text x="170" y="513" font-size="14">stops the plant: E-stop, motor trip, overload, communication loss</text>
<rect x="40" y="536" width="1120" height="42" rx="6" fill="#ffffff" stroke="#b86e00" stroke-width="1.3"/>
<rect x="40" y="536" width="110" height="42" rx="6" fill="#b86e00" stroke="#b86e00" stroke-width="0"/>
<text x="95" y="563" font-size="14" fill="#ffffff" font-weight="700" text-anchor="middle">Medium</text>
<text x="170" y="563" font-size="14">holds the batch: weight out of tolerance, gate not closed, silo low</text>
<rect x="40" y="586" width="1120" height="42" rx="6" fill="#ffffff" stroke="#0b7a83" stroke-width="1.3"/>
<rect x="40" y="586" width="110" height="42" rx="6" fill="#0b7a83" stroke="#0b7a83" stroke-width="0"/>
<text x="95" y="613" font-size="14" fill="#ffffff" font-weight="700" text-anchor="middle">Low</text>
<text x="170" y="613" font-size="14">information: maintenance due, sensor drift, operator notices</text>
<text x="40" y="660" font-size="13.5" fill="#5b6b7c">Every alarm is time-stamped and logged with its tag, priority, value and who acknowledged it,</text>
<text x="40" y="682" font-size="13.5" fill="#5b6b7c">so the SCADA history explains each stop and each held batch.</text>
<text x="1160" y="704" font-size="12" fill="#5b6b7c" text-anchor="end">Mohammed Mahyoub, Industrial Automation &amp; PLC-Based Control Systems</text>
</svg>