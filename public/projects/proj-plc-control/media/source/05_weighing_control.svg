<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 780" width="1200" height="780" fill="#1d2733" role="img" aria-label="Weighing control: coarse and fine feed">
<title>Weighing control: coarse and fine feed</title>
<defs><style>text{font-family:'Segoe UI', Helvetica, Arial, 'Liberation Sans', sans-serif}.m{font-family:Consolas, 'DejaVu Sans Mono', monospace}</style><marker id="k1f3a5f" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f3a5f"/></marker><marker id="k0b7a83" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0b7a83"/></marker><marker id="kb86e00" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b86e00"/></marker><marker id="kb3261e" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b3261e"/></marker><marker id="k2e7d4f" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e7d4f"/></marker><marker id="k5b6b7c" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5b6b7c"/></marker><marker id="k1d2733" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1d2733"/></marker></defs>
<rect width="1200" height="780" fill="#ffffff"/>
<rect x="0" y="0" width="1200" height="6" fill="#1f3a5f"/>
<text x="40" y="52" font-size="26" font-weight="700">Weighing control: coarse and fine feed</text>
<text x="40" y="80" font-size="15" fill="#5b6b7c">How the PLC reaches the target weight accurately for each material</text>
<rect x="120" y="130" width="700" height="420" rx="0" fill="#ffffff" stroke="#d5dde6" stroke-width="1"/>
<line x1="120" y1="550" x2="820" y2="550" stroke="#1d2733" stroke-width="1.5"/>
<line x1="120" y1="130" x2="120" y2="550" stroke="#1d2733" stroke-width="1.5"/>
<text x="470" y="584" font-size="13" fill="#5b6b7c" font-weight="600" text-anchor="middle">time</text>
<text x="70" y="340" font-size="13" fill="#5b6b7c" font-weight="600" text-anchor="middle" transform="rotate(-90 70 340)">weight in hopper</text>
<rect x="120" y="197.2" width="700" height="16.8" fill="#e6f3ea"/>
<line x1="120" y1="205.6" x2="820" y2="205.6" stroke="#2e7d4f" stroke-width="2"/>
<text x="832" y="191.6" font-size="13" fill="#2e7d4f" font-weight="700">target ± tolerance</text>
<line x1="120" y1="289.6" x2="820" y2="289.6" stroke="#b86e00" stroke-width="1.5" stroke-dasharray="6 4"/>
<text x="832" y="294.6" font-size="13" fill="#b86e00" font-weight="700">coarse cut-off</text>
<line x1="120" y1="218.2" x2="820" y2="218.2" stroke="#0b7a83" stroke-width="1.5" stroke-dasharray="6 4"/>
<text x="832" y="236.2" font-size="13" fill="#0b7a83" font-weight="700">fine cut-off</text>
<text x="832" y="253.2" font-size="12" fill="#5b6b7c">(target − in-flight)</text>
<path d="M 120 550 L 155 550 L 414 290 L 449 273 L 666 218 L 708 206 L 820 206" fill="none" stroke="#1f3a5f" stroke-width="3"/>
<line x1="155" y1="560" x2="414" y2="560" stroke="#b86e00" stroke-width="5"/>
<text x="284.5" y="538" font-size="12.5" fill="#b86e00" font-weight="700" text-anchor="middle">coarse feed</text>
<line x1="449" y1="560" x2="666" y2="560" stroke="#0b7a83" stroke-width="5"/>
<text x="557.5" y="538" font-size="12.5" fill="#0b7a83" font-weight="700" text-anchor="middle">fine feed</text>
<line x1="666" y1="560" x2="708" y2="560" stroke="#5b6b7c" stroke-width="5"/>
<text x="687" y="520" font-size="12.5" fill="#5b6b7c" font-weight="700" text-anchor="middle">in-flight</text>
<line x1="722" y1="560" x2="813" y2="560" stroke="#2e7d4f" stroke-width="5"/>
<text x="767.5" y="538" font-size="12.5" fill="#2e7d4f" font-weight="700" text-anchor="middle">settle &amp; check</text>
<rect x="40" y="610" width="1120" height="140" rx="10" fill="#f6f8fb" stroke="#d5dde6" stroke-width="1"/>
<text x="60" y="640" font-size="16" fill="#1f3a5f" font-weight="700">Why two speeds</text>
<text x="60" y="666" font-size="14">Coarse feed fills fast until most of the target is reached; fine feed then trickles in the rest at low flow for accuracy.</text>
<text x="60" y="692" font-size="14">Material still falling when the gate closes (in-flight) is learned from previous batches and subtracted from the cut-off.</text>
<text x="60" y="718" font-size="14">After settling, the weight must sit inside the tolerance band before the hopper is released; otherwise the batch holds with an alarm.</text>
<text x="1160" y="764" font-size="12" fill="#5b6b7c" text-anchor="end">Mohammed Mahyoub, Industrial Automation &amp; PLC-Based Control Systems</text>
</svg>