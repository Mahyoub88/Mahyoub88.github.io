<rect width="1200" height="760" fill="#ffffff"/>
<rect x="0" y="0" width="1200" height="6" fill="#1f3a5f"/>
<text x="40" y="52" font-size="26" font-weight="700">PLC logic example: mixer motor with interlocks</text>
<text x="40" y="80" font-size="15" fill="#5b6b7c">Ladder diagram pattern used for every motor in the plant: start/stop, seal-in and safety conditions</text>
<line x1="80" y1="130" x2="80" y2="470" stroke="#1d2733" stroke-width="3"/>
<line x1="1120" y1="130" x2="1120" y2="470" stroke="#1d2733" stroke-width="3"/>
<text x="40" y="205" font-size="14" fill="#5b6b7c" font-weight="700">1</text>
<line x1="140" y1="184" x2="140" y2="216" stroke="#1f3a5f" stroke-width="2.5"/>
<line x1="158" y1="184" x2="158" y2="216" stroke="#1f3a5f" stroke-width="2.5"/>
<text x="149" y="176" font-size="12.5" fill="#1f3a5f" font-weight="700" text-anchor="middle">START</text>
<line x1="260" y1="184" x2="260" y2="216" stroke="#1f3a5f" stroke-width="2.5"/>
<line x1="278" y1="184" x2="278" y2="216" stroke="#1f3a5f" stroke-width="2.5"/>
<line x1="256" y1="214" x2="282" y2="186" stroke="#1f3a5f" stroke-width="2"/>
<text x="269" y="176" font-size="12.5" fill="#1f3a5f" font-weight="700" text-anchor="middle">STOP</text>
<line x1="380" y1="184" x2="380" y2="216" stroke="#b3261e" stroke-width="2.5"/>
<line x1="398" y1="184" x2="398" y2="216" stroke="#b3261e" stroke-width="2.5"/>
<text x="389" y="176" font-size="12.5" fill="#b3261e" font-weight="700" text-anchor="middle">E-STOP OK</text>
<line x1="520" y1="184" x2="520" y2="216" stroke="#b3261e" stroke-width="2.5"/>
<line x1="538" y1="184" x2="538" y2="216" stroke="#b3261e" stroke-width="2.5"/>
<line x1="516" y1="214" x2="542" y2="186" stroke="#b3261e" stroke-width="2"/>
<text x="529" y="176" font-size="12.5" fill="#b3261e" font-weight="700" text-anchor="middle">OVERLOAD</text>
<line x1="660" y1="184" x2="660" y2="216" stroke="#1f3a5f" stroke-width="2.5"/>
<line x1="678" y1="184" x2="678" y2="216" stroke="#1f3a5f" stroke-width="2.5"/>
<text x="669" y="176" font-size="12.5" fill="#1f3a5f" font-weight="700" text-anchor="middle">DISCHARGE CLOSED</text>
<line x1="820" y1="184" x2="820" y2="216" stroke="#1f3a5f" stroke-width="2.5"/>
<line x1="838" y1="184" x2="838" y2="216" stroke="#1f3a5f" stroke-width="2.5"/>
<text x="829" y="176" font-size="12.5" fill="#1f3a5f" font-weight="700" text-anchor="middle">AUTO / MAN OK</text>
<path d="M 1010 184 A 18 18 0 0 0 1010 216" fill="none" stroke="#b86e00" stroke-width="2.5"/>
<path d="M 1034 184 A 18 18 0 0 1 1034 216" fill="none" stroke="#b86e00" stroke-width="2.5"/>
<text x="1022" y="176" font-size="12.5" fill="#b86e00" font-weight="700" text-anchor="middle">MIXER_RUN</text>
<line x1="80" y1="200" x2="140" y2="200" stroke="#1d2733" stroke-width="2"/>
<line x1="158" y1="200" x2="260" y2="200" stroke="#1d2733" stroke-width="2"/>
<line x1="278" y1="200" x2="380" y2="200" stroke="#1d2733" stroke-width="2"/>
<line x1="398" y1="200" x2="520" y2="200" stroke="#1d2733" stroke-width="2"/>
<line x1="538" y1="200" x2="660" y2="200" stroke="#1d2733" stroke-width="2"/>
<line x1="678" y1="200" x2="820" y2="200" stroke="#1d2733" stroke-width="2"/>
<line x1="838" y1="200" x2="1010" y2="200" stroke="#1d2733" stroke-width="2"/>
<line x1="1034" y1="200" x2="1120" y2="200" stroke="#1d2733" stroke-width="2"/>
<path d="M 110 200 V 280 H 140 M 158 280 H 210 V 200" fill="none" stroke="#1d2733" stroke-width="2"/>
<line x1="140" y1="264" x2="140" y2="296" stroke="#1f3a5f" stroke-width="2.5"/>
<line x1="158" y1="264" x2="158" y2="296" stroke="#1f3a5f" stroke-width="2.5"/>
<text x="149" y="256" font-size="12.5" fill="#1f3a5f" font-weight="700" text-anchor="middle">MIXER_RUN</text>
<text x="230" y="286" font-size="12.5" fill="#5b6b7c">seal-in: keeps the motor running after START is released</text>
<text x="40" y="405" font-size="14" fill="#5b6b7c" font-weight="700">2</text>
<line x1="140" y1="384" x2="140" y2="416" stroke="#1f3a5f" stroke-width="2.5"/>
<line x1="158" y1="384" x2="158" y2="416" stroke="#1f3a5f" stroke-width="2.5"/>
<text x="149" y="376" font-size="12.5" fill="#1f3a5f" font-weight="700" text-anchor="middle">MIXER_RUN</text>
<line x1="300" y1="384" x2="300" y2="416" stroke="#b3261e" stroke-width="2.5"/>
<line x1="318" y1="384" x2="318" y2="416" stroke="#b3261e" stroke-width="2.5"/>
<line x1="296" y1="414" x2="322" y2="386" stroke="#b3261e" stroke-width="2"/>
<text x="309" y="376" font-size="12.5" fill="#b3261e" font-weight="700" text-anchor="middle">RUN FEEDBACK</text>
<line x1="460" y1="384" x2="460" y2="416" stroke="#1f3a5f" stroke-width="2.5"/>
<line x1="478" y1="384" x2="478" y2="416" stroke="#1f3a5f" stroke-width="2.5"/>
<text x="469" y="376" font-size="12.5" fill="#1f3a5f" font-weight="700" text-anchor="middle">TIMER 3 s DONE</text>
<path d="M 1010 384 A 18 18 0 0 0 1010 416" fill="none" stroke="#b86e00" stroke-width="2.5"/>
<path d="M 1034 384 A 18 18 0 0 1 1034 416" fill="none" stroke="#b86e00" stroke-width="2.5"/>
<text x="1022" y="376" font-size="12.5" fill="#b86e00" font-weight="700" text-anchor="middle">ALARM_MIXER</text>
<line x1="80" y1="400" x2="140" y2="400" stroke="#1d2733" stroke-width="2"/>
<line x1="158" y1="400" x2="300" y2="400" stroke="#1d2733" stroke-width="2"/>
<line x1="318" y1="400" x2="460" y2="400" stroke="#1d2733" stroke-width="2"/>
<line x1="478" y1="400" x2="1010" y2="400" stroke="#1d2733" stroke-width="2"/>
<line x1="1034" y1="400" x2="1120" y2="400" stroke="#1d2733" stroke-width="2"/>
<text x="560" y="440" font-size="12.5" fill="#5b6b7c">commanded but no feedback after 3 s → motor failed to start</text>
<rect x="40" y="520" width="1120" height="200" rx="10" fill="#f6f8fb" stroke="#d5dde6" stroke-width="1"/>
<text x="60" y="550" font-size="16" fill="#1f3a5f" font-weight="700">How to read it</text>
<text x="60" y="578" font-size="14">Power flows left to right. The coil MIXER_RUN is energised only when every contact on the rung is closed.</text>
<text x="60" y="604" font-size="14">STOP and OVERLOAD are normally-closed contacts: a broken wire opens them and stops the motor (fail-safe).</text>
<text x="60" y="630" font-size="14">Rung 2 compares the command with the contactor feedback, so a motor that does not actually start raises an alarm.</text>
<text x="60" y="656" font-size="14">The same pattern repeats for conveyors, screws, pumps and fans, with process interlocks added per machine.</text>
<text x="60" y="682" font-size="14">Shown as a typical pattern; tag names and timer values come from the project's I/O list and control philosophy.</text>
<text x="1160" y="744" font-size="12" fill="#5b6b7c" text-anchor="end">Mohammed Mahyoub, Industrial Automation &amp; PLC-Based Control Systems</text>
</svg>