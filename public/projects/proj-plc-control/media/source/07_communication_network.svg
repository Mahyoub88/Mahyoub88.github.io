<rect x="330" y="340" width="150" height="90" rx="8" fill="#ffffff" stroke="#2e7d4f" stroke-width="1.5"/>
<text x="344" y="366" font-size="14" fill="#2e7d4f" font-weight="700">Weighing indicator</text>
<text x="344" y="390.3" font-size="12.5">cement</text>
<text x="344" y="407.1" font-size="12.5">slave address 2</text>
<line x1="595" y1="300" x2="595" y2="340" stroke="#2e7d4f" stroke-width="2"/>
<rect x="520" y="340" width="150" height="90" rx="8" fill="#ffffff" stroke="#2e7d4f" stroke-width="1.5"/>
<text x="534" y="366" font-size="14" fill="#2e7d4f" font-weight="700">Weighing indicator</text>
<text x="534" y="390.3" font-size="12.5">water</text>
<text x="534" y="407.1" font-size="12.5">slave address 3</text>
<line x1="785" y1="300" x2="785" y2="340" stroke="#2e7d4f" stroke-width="2"/>
<rect x="710" y="340" width="150" height="90" rx="8" fill="#ffffff" stroke="#2e7d4f" stroke-width="1.5"/>
<text x="724" y="366" font-size="14" fill="#2e7d4f" font-weight="700">VFD</text>
<text x="724" y="390.3" font-size="12.5">mixer / conveyor</text>
<text x="724" y="407.1" font-size="12.5">slave address 4</text>
<line x1="975" y1="300" x2="975" y2="340" stroke="#2e7d4f" stroke-width="2"/>
<rect x="900" y="340" width="150" height="90" rx="8" fill="#ffffff" stroke="#2e7d4f" stroke-width="1.5"/>
<text x="914" y="366" font-size="14" fill="#2e7d4f" font-weight="700">Power meter</text>
<text x="914" y="390.3" font-size="12.5">energy, current</text>
<text x="914" y="407.1" font-size="12.5">slave address 5</text>
<rect x="40" y="470" width="1120" height="210" rx="10" fill="#f6f8fb" stroke="#d5dde6" stroke-width="1"/>
<text x="60" y="500" font-size="16" fill="#1f3a5f" font-weight="700">How the PLC talks to the field</text>
<text x="60" y="528" font-size="14">The PLC is the Modbus master and polls each slave in turn: read weight and status registers, write set-points.</text>
<text x="60" y="554" font-size="14">Each device has a unique slave address and the same baud rate, parity and stop bits as the master.</text>
<text x="60" y="580" font-size="14">A slave that stops answering is flagged after a few retries, and the batch holds rather than using stale data.</text>
<text x="60" y="606" font-size="14">Supervision runs on Ethernet, so a busy SCADA screen never slows the field polling cycle.</text>
<text x="60" y="632" font-size="14">Addresses and devices shown are a typical layout for a batching plant, not a specific as-built list.</text>
<text x="1160" y="704" font-size="12" fill="#5b6b7c" text-anchor="end">Mohammed Mahyoub, Industrial Automation &amp; PLC-Based Control Systems</text>
</svg>