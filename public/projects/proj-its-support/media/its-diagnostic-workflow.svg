<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" role="img"><title>ITS — commissioning and fault isolation</title><desc>Trace symptoms across the field, transport and application layers</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10" fill="#5eead4"/></marker><pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#20334b" stroke-width=".5"/></pattern></defs><rect width="1440" height="900" fill="#091321"/><rect width="1440" height="900" fill="url(#grid)"/><text x="50" y="64" fill="#5eead4" font-family="Arial" font-size="15" letter-spacing="3">ENGINEERING SYSTEMS • MOHAMMED MAHYOUB</text><text x="50" y="112" fill="#f8fafc" font-family="Arial" font-size="32" font-weight="bold">ITS — commissioning and fault isolation</text><text x="50" y="148" fill="#b7c9dd" font-family="Arial" font-size="18">Trace symptoms across the field, transport and application layers</text><rect x="50" y="220" width="390" height="165" rx="16" fill="#14263b" stroke="#5eead4" stroke-width="1.5"/><text x="70" y="254" fill="#5eead4" font-family="Arial" font-size="21" font-weight="bold">01 · Field devices</text><text x="70" y="286" fill="#d8e5f4" font-family="Arial" font-size="17">Camera / LiDAR / control unit</text><text x="70" y="311" fill="#d8e5f4" font-family="Arial" font-size="17">Availability and sensor validity</text><text x="70" y="336" fill="#d8e5f4" font-family="Arial" font-size="17">Configuration and calibration</text><rect x="525" y="220" width="390" height="165" rx="16" fill="#14263b" stroke="#5eead4" stroke-width="1.5"/><text x="545" y="254" fill="#5eead4" font-family="Arial" font-size="21" font-weight="bold">02 · Network transport</text><text x="545" y="286" fill="#d8e5f4" font-family="Arial" font-size="17">Field-to-backend connectivity</text><text x="545" y="311" fill="#d8e5f4" font-family="Arial" font-size="17">Interface trace</text><text x="545" y="336" fill="#d8e5f4" font-family="Arial" font-size="17">Locate the failing boundary</text><rect x="1000" y="220" width="390" height="165" rx="16" fill="#14263b" stroke="#5eead4" stroke-width="1.5"/><text x="1020" y="254" fill="#5eead4" font-family="Arial" font-size="21" font-weight="bold">03 · Application layer</text><text x="1020" y="286" fill="#d8e5f4" font-family="Arial" font-size="17">Database / software interfaces</text><text x="1020" y="311" fill="#d8e5f4" font-family="Arial" font-size="17">Operational behaviour</text><text x="1020" y="336" fill="#d8e5f4" font-family="Arial" font-size="17">Validate the complete path</text><path d="M445 302L520 302" stroke="#5eead4" stroke-width="2.5"  fill="none" marker-end="url(#arrow)"/><path d="M920 302L995 302" stroke="#5eead4" stroke-width="2.5"  fill="none" marker-end="url(#arrow)"/><rect x="50" y="520" width="390" height="185" rx="16" fill="#14263b" stroke="#5eead4" stroke-width="1.5"/><text x="70" y="554" fill="#5eead4" font-family="Arial" font-size="21" font-weight="bold">04 · Reproduce the issue</text><text x="70" y="586" fill="#d8e5f4" font-family="Arial" font-size="17">Capture observable symptoms</text><text x="70" y="611" fill="#d8e5f4" font-family="Arial" font-size="17">Separate device and network faults</text><text x="70" y="636" fill="#d8e5f4" font-family="Arial" font-size="17">Preserve diagnostic context</text><rect x="525" y="520" width="390" height="185" rx="16" fill="#14263b" stroke="#5eead4" stroke-width="1.5"/><text x="545" y="554" fill="#5eead4" font-family="Arial" font-size="21" font-weight="bold">05 · Correct and verify</text><text x="545" y="586" fill="#d8e5f4" font-family="Arial" font-size="17">Apply the identified correction</text><text x="545" y="611" fill="#d8e5f4" font-family="Arial" font-size="17">Recheck affected interfaces</text><text x="545" y="636" fill="#d8e5f4" font-family="Arial" font-size="17">Confirm post-fix behaviour</text><rect x="1000" y="520" width="390" height="185" rx="16" fill="#14263b" stroke="#5eead4" stroke-width="1.5"/><text x="1020" y="554" fill="#5eead4" font-family="Arial" font-size="21" font-weight="bold">06 · Document the outcome</text><text x="1020" y="586" fill="#d8e5f4" font-family="Arial" font-size="17">Commissioning / calibration record</text><text x="1020" y="611" fill="#d8e5f4" font-family="Arial" font-size="17">Root-cause explanation</text><text x="1020" y="636" fill="#d8e5f4" font-family="Arial" font-size="17">Verification evidence</text><path d="M445 610L520 610" stroke="#5eead4" stroke-width="2.5"  fill="none" marker-end="url(#arrow)"/><path d="M920 610L995 610" stroke="#5eead4" stroke-width="2.5"  fill="none" marker-end="url(#arrow)"/><text x="50" y="775" fill="#b7c9dd" font-family="Arial" font-size="18">Diagnostic sequence explains the engineering method; no customer incident or unrecorded pass result is claimed.</text><path d="M50 826H1390" stroke="#36506c"/><text x="50" y="855" fill="#b7c9dd" font-family="Arial" font-size="16">Explanatory design based on documented scope • Illustration, not an installation photograph or measured result</text></svg>