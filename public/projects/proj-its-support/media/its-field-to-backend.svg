<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" role="img"><title>ITS — from roadside sensing to backend operations</title><desc>Conceptual illustration of the documented integration boundaries</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10" fill="#5eead4"/></marker><pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#20334b" stroke-width=".5"/></pattern></defs><rect width="1440" height="900" fill="#091321"/><rect width="1440" height="900" fill="url(#grid)"/><text x="50" y="64" fill="#5eead4" font-family="Arial" font-size="15" letter-spacing="3">ENGINEERING SYSTEMS • MOHAMMED MAHYOUB</text><text x="50" y="112" fill="#f8fafc" font-family="Arial" font-size="32" font-weight="bold">ITS — from roadside sensing to backend operations</text><text x="50" y="148" fill="#b7c9dd" font-family="Arial" font-size="18">Conceptual illustration of the documented integration boundaries</text><path d="M270 490L570 255H860L1170 490L800 715H600Z" fill="#20334b" stroke="#456681" stroke-width="2"/><path d="M570 287L1030 585M515 338L940 660" stroke="#e6edf3" stroke-width="4" stroke-dasharray="24 20"/><path d="M550 483L653 422L737 483L634 545Z" fill="#5eead4" stroke="#d5fff7"/><path d="M550 483V515L634 575V545Z" fill="#287f81"/><path d="M634 545L737 483V515L634 575Z" fill="#206d74"/><path d="M428 392V263" stroke="#91a6bb" stroke-width="10"/><rect x="388" y="228" width="104" height="56" rx="9" fill="#14263b" stroke="#60a5fa" stroke-width="3"/><circle cx="473" cy="255" r="13" fill="#60a5fa"/><path d="M480 277L670 442M490 260L758 438" stroke="#60a5fa" stroke-width="2" stroke-dasharray="7 5"/><text x="403" y="211" fill="#60a5fa" font-family="Arial" font-size="18">Camera / LiDAR sensing</text><rect x="50" y="560" width="380" height="145" rx="16" fill="#14263b" stroke="#5eead4" stroke-width="1.5"/><text x="70" y="594" fill="