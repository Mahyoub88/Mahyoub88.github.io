<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc"><title id="title">MPLS VPN: customer edge, provider edge and transport</title><desc id="desc">Conceptual view of the VRF, backbone and MP-BGP responsibilities.. Functional explanation; node grouping is illustrative, not an as-built configuration.</desc><rect width="1200" height="720" rx="18" fill="#0b1626"/><g font-family="Arial,sans-serif"><text x="40" y="45" font-size="14" fill="#5eead4">NETWORK ENGINEERING · MOHAMMED MAHYOUB</text><text x="40" y="95" font-size="30" fill="#dce7f4">MPLS VPN: customer edge, provider edge and transport</text><text x="40" y="136" font-size="17" fill="#a9bbd2">Conceptual view of the VRF, backbone and MP-BGP responsibilities.</text><rect x="40" y="280" width="170" height="135" rx="12" fill="#15283d" stroke="#5eead4"/><text x="58" y="312" font-size="20" fill="#5eead4">Customer edge</text><text x="58" y="345" font-size="16" fill="#dce7f4">Local site routes</text><rect x="280" y="280" width="170" height="135" rx="12" fill="#15283d" stroke="#5eead4"/><text x="298" y="312" font-size="20" fill="#5eead4">Provider edge</text><text x="298" y="345" font-size="16" fill="#dce7f4">Customer VRF</text><text x="298" y="370" font-size="16" fill="#dce7f4">VPN route handling</text><rect x="520" y="280" width="170" height="135" rx="12" fill="#15283d" stroke="#5eead4"/><text x="538" y="312" font-size="20" fill="#5eead4">MPLS transport</text><text x="538" y="345" font-size="16" fill="#dce7f4">Provider backbone</text><text x="538" y="370" font-size="16" fill="#dce7f4">OSPF / TE scope</text><rect x="760" y="280" width="170" height="135" rx="12" fill="#15283d" stroke="#5eead4"/><text x="778" y="312" font-size="20" fill="#5eead4">Provider edge</text><text x="778" y="345" font-size="16" fill="#dce7f4">Customer VRF</text><text x="778" y="370" font-size="16" fill="#dce7f4">VPN route handling</text><rect x="1000" y="280" width="170" height="135" rx="12" fill="#15283d" stroke="#5eead4"/><text x="1018" y="312" font-size="20" fill="#5eead4">Customer edge</text><text x="1018" y="345" font-size="16" fill="#dce7f4">Remote site routes</text><path d="M210 350L280 350" stroke="#5eead4" stroke-width="3"  fill="none"/><path d="M450 350L520 350" stroke="#5eead4" stroke-width="3"  fill="none"/><path d="M690 350L760 350" stroke="#5eead4" stroke-width="3"  fill="none"/><path d="M930 350L1000 350" stroke="#5eead4" stroke-width="3"  fill="none"/><path d="M365 280V215H845V280" stroke="#ffbd69" stroke-width="3" stroke-dasharray="9 6" fill="none"/><text x="400" y="196" font-size="19" fill="#ffbd69">MP-BGP: VPN route exchange</text><rect x="40" y="485" width="530" height="115" rx="12" fill="#15283d" stroke="#5eead4"/><text x="58" y="517" font-size="20" fill="#5eead4">Control-plane questions</text><text x="58" y="550" font-size="16" fill="#dce7f4">Are expected routes present in the intended VRF?</text><text x="58" y="575" font-size="16" fill="#dce7f4">Are the VPN route boundaries consistent?</text><rect x="610" y="485" width="560" height="115" rx="12" fill="#15283d" stroke="#5eead4"/><text x="628" y="517" font-size="20" fill="#5eead4">Data-plane questions</text><text x="628" y="550" font-size="16" fill="#dce7f4">Does the intended customer path forward end to end?</text><text x="628" y="575" font-size="16" fill="#dce7f4">Can a fault be isolated to access, edge or transport?</text><path d="M40 647H1160" stroke="#344960"/><text x="40" y="685" font-size="16" fill="#a9bbd2">Explanatory diagram · no recovered IP plan, configuration or measured performance is implied.</text></g></svg>