<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc"><title id="title">Enterprise infrastructure: access, routing and site services</title><desc id="desc">Separate local access, site-to-site connectivity and operational services.. Functional explanation; node grouping is illustrative, not an as-built configuration.</desc><rect width="1200" height="720" rx="18" fill="#0b1626"/><g font-family="Arial,sans-serif"><text x="40" y="45" font-size="14" fill="#5eead4">NETWORK ENGINEERING · MOHAMMED MAHYOUB</text><text x="40" y="95" font-size="30" fill="#dce7f4">Enterprise infrastructure: access, routing and site services</text><text x="40" y="136" font-size="17" fill="#a9bbd2">Separate local access, site-to-site connectivity and operational services.</text><rect x="40" y="210" width="270" height="135" rx="12" fill="#15283d" stroke="#5eead4"/><text x="58" y="242" font-size="20" fill="#5eead4">Wireless / wired access</text><text x="58" y="275" font-size="16" fill="#dce7f4">MikroTik / Ubiquiti</text><text x="58" y="300" font-size="16" fill="#dce7f4">Users and local devices</text><rect x="40" y="415" width="270" height="135" rx="12" fill="#15283d" stroke="#5eead4"/><text x="58" y="447" font-size="20" fill="#5eead4">Infrastructure endpoints</text><text x="58" y="480" font-size="16" fill="#dce7f4">Surveillance connectivity</text><text x="58" y="505" font-size="16" fill="#dce7f4">Access-control connectivity</text><path d="M310 277L405 277" stroke="#5eead4" stroke-width="3"  fill="none"/><path d="M310 482L405 482" stroke="#5eead4" stroke-width="3"  fill="none"/><rect x="405" y="200" width="325" height="370" rx="12" fill="#15283d" stroke="#5eead4"/><text x="423" y="232" font-size="20" fill="#5eead4">Site routing and policy</text><text x="423" y="265" font-size="16" fill="#dce7f4">LAN and wireless zones</text><text x="423" y="290" font-size="16" fill="#dce7f4">Traffic-management boundaries</text><text x="423" y="315" font-size="16" fill="#dce7f4">VPN / secure routing</text><text x="423" y="340" font-size="16" fill="#dce7f4"></text><text x="423" y="365" font-size="16" fill="#dce7f4">Logical grouping shown here</text><text x="423" y="390" font-size="16" fill="#dce7f4">does not specify customer sites.</text><path d="M730 280L850 280" stroke="#5eead4" stroke-width="3"  fill="none"/><rect x="850" y="210" width="300" height="135" rx="12" fill="#15283d" stroke="#5eead4"/><text x="868" y="242" font-size="20" fill="#5eead4">Remote-site connectivity</text><text x="868" y="275" font-size="16" fill="#dce7f4">Site-to-site transport</text><text x="868" y="300" font-size="16" fill="#dce7f4">VPN peer / route reachability</text><path d="M730 480L850 480" stroke="#ffbd69" stroke-width="3" stroke-dasharray="8 5" fill="none"/><rect x="850" y="415" width="300" height="135" rx="12" fill="#15283d" stroke="#5eead4"/><text x="868" y="447" font-size="20" fill="#5eead4">Operations and diagnosis</text><text x="868" y="480" font-size="16" fill="#dce7f4">Device / route visibility</text><text x="868" y="505" font-size="16" fill="#dce7f4">Verify the affected data path</text><path d="M40 647H1160" stroke="#344960"/><text x="40" y="685" font-size="16" fill="#a9bbd2">Explanatory diagram · no recovered IP plan, configuration or measured performance is implied.</text></g></svg>