<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc"><title id="title">Wireless-path planning: geometry and clearance</title><desc id="desc">A clear antenna-to-antenna line does not alone establish usable radio performance.. Functional explanation; node grouping is illustrative, not an as-built configuration.</desc><rect width="1200" height="720" rx="18" fill="#0b1626"/><g font-family="Arial,sans-serif"><text x="40" y="45" font-size="14" fill="#5eead4">NETWORK ENGINEERING · MOHAMMED MAHYOUB</text><text x="40" y="95" font-size="30" fill="#dce7f4">Wireless-path planning: geometry and clearance</text><text x="40" y="136" font-size="17" fill="#a9bbd2">A clear antenna-to-antenna line does not alone establish usable radio performance.</text><path d="M55 535L250 493L380 510L520 460L615 430L715 492L915 488L1135 535V605H55Z" fill="#203b51"/><path d="M140 520V270M1060 520V270" stroke="#a9bbd2" stroke-width="7"/><path d="M140 270L1060 270" stroke="#5eead4" stroke-width="3"/><ellipse cx="600" cy="270" rx="460" ry="115" stroke="#5eead4" stroke-width="2" stroke-dasharray="9 6" fill="#5eead4" fill-opacity=".08"/><text x="65" y="237" font-size="19" fill="#dce7f4">Antenna A</text><text x="985" y="237" font-size="19" fill="#dce7f4">Antenna B</text><text x="405" y="253" font-size="19" fill="#5eead4">Direct line of sight</text><text x="400" y="411" font-size="17" fill="#a9bbd2">Fresnel clearance envelope — schematic</text><text x="480" y="580" font-size="17" fill="#a9bbd2">Terrain / obstruction profile</text><rect x="370" y="465" width="470" height="110" rx="12" fill="#15283d" stroke="#5eead4"/><text x="388" y="497" font-size="20" fill="#5eead4">Separate engineering checks</text><text x="388" y="530" font-size="16" fill="#dce7f4">Path geometry · antenna alignment</text><text x="388" y="555" font-size="16" fill="#dce7f4">Coverage · capacity · field verification</text><path d="M40 647H1160" stroke="#344960"/><text x="40" y="685" font-size="16" fill="#a9bbd2">Explanatory diagram · no recovered IP plan, configuration or measured performance is implied.</text></g></svg>