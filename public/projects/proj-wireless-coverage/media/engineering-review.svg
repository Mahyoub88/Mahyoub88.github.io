<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 660" role="img" aria-labelledby="t d"><title id="t">Wireless planning: three independent evidence paths</title><desc id="d">Project-specific explanatory diagram. Not an as-built schematic or new test result.</desc><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto-start-reverse"><path d="M0 0 L7 3 L0 6" fill="#5b9dff"/></marker></defs><rect width="1240" height="660" rx="18" fill="#0a0e18"/><g font-family="Arial,sans-serif"><text x="40" y="48" fill="#5b9dff" font-size="17">ENGINEERING EXPLANATION</text><text x="40" y="91" fill="#f5f7fb" font-size="29">Wireless planning: three independent evidence paths</text><rect x="40" y="165" width="330" height="150" rx="12" fill="#121828" stroke="#5b9dff"/><text x="56" y="203" fill="#f5f7fb" font-size="22">Coverage</text><text x="56" y="234" fill="#b7c0d4" font-size="17">Client area / radio conditions</text><rect x="455" y="165" width="330" height="150" rx="12" fill="#121828" stroke="#5b9dff"/><text x="471" y="203" fill="#f5f7fb" font-size="22">Point-to-point path</text><text x="471" y="234" fill="#b7c0d4" font-size="17">Geometry / alignment / loss</text><rect x="870" y="165" width="330" height="150" rx="12" fill="#121828" stroke="#5b9dff"/><text x="886" y="203" fill="#f5f7fb" font-size="22">Capacity</text><text x="886" y="234" fill="#b7c0d4" font-size="17">Traffic demand / offered load</text><rect x="40" y="420" width="330" height="105" rx="12" fill="#121828" stroke="#5b9dff"/><text x="56" y="458" fill="#f5f7fb" font-size="22">Coverage observations</text><text x="56" y="489" fill="#b7c0d4" font-size="17">Location and conditions</text><rect x="455" y="420" width="330" height="105" rx="12" fill="#121828" stroke="#5b9dff"/><text x="471" y="458" fill="#f5f7fb" font-size="22">Link observations</text><text x="471" y="489" fill="#b7c0d4" font-size="17">Clearance and link quality</text><rect x="870" y="420" width="330" height="105" rx="12" fill="#121828" stroke="#5b9dff"/><text x="886" y="458" fill="#f5f7fb" font-size="22">Service observations</text><text x="886" y="489" fill="#b7c0d4" font-size="17">Direction and payload rate</text><path d="M205 315 L205 420" fill="none" stroke="#5b9dff" stroke-width="3"  marker-end="url(#a)"/><path d="M620 315 L620 420" fill="none" stroke="#5b9dff" stroke-width="3"  marker-end="url(#a)"/><path d="M1035 315 L1035 420" fill="none" stroke="#5b9dff" stroke-width="3"  marker-end="url(#a)"/><text x="40" y="571" fill="#b7c0d4" font-size="22">Prediction ≠ measured coverage · Negotiated radio rate ≠ application throughput</text><text x="40" y="624" fill="#b7c0d4" font-size="17">Authored documentation visual · Illustrative review model, not original implementation evidence</text></g></svg>