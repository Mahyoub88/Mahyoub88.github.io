<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 450" role="img" aria-labelledby="title desc"><title id="title">Independent engineering applications</title><desc id="desc">Four separate applications. Integration is a future design option, not a verified implementation.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#67e8d0"/></marker></defs><rect width="960" height="450" rx="20" fill="#0b1220"/><g font-family="Arial,sans-serif"><text x="40" y="48" font-size="24" fill="#f8fafc">Independent engineering applications</text><text x="40" y="78" font-size="14" fill="#a9bdd3">PROPOSED DESIGN · Not recovered application source</text><rect x="40" y="100" width="410" height="100" rx="12" fill="#172c43" stroke="#52718a"/><text x="58" y="136" font-size="19" fill="#67e8d0">Monitoring</text><text x="58" y="170" font-size="14" fill="#d7e3f3">Status, diagnostics and incidents</text><rect x="500" y="100" width="410" height="100" rx="12" fill="#172c43" stroke="#52718a"/><text x="518" y="136" font-size="19" fill="#67e8d0">Service operations</text><text x="518" y="170" font-size="14" fill="#d7e3f3">Device history and repair records</text><rect x="40" y="250" width="410" height="100" rx="12" fill="#172c43" stroke="#52718a"/><text x="58" y="286" font-size="19" fill="#67e8d0">RF link budget</text><text x="58" y="320" font-size="14" fill="#d7e3f3">Power, loss, noise and margin</text><rect x="500" y="250" width="410" height="100" rx="12" fill="#172c43" stroke="#52718a"/><text x="518" y="286" font-size="19" fill="#67e8d0">Fresnel planning</text><text x="518" y="320" font-size="14" fill="#d7e3f3">Path geometry and obstruction clearance</text><text x="40" y="430" font-size="13" fill="#a9bdd3">Four separate applications. Integration is a future design option, not a verified implementation.</text></g></svg>