<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 660" role="img" aria-labelledby="t d"><title id="t">Fresnel geometry: evaluate clearance at each obstacle</title><desc id="d">Project-specific explanatory diagram. Not an as-built schematic or new test result.</desc><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto-start-reverse"><path d="M0 0 L7 3 L0 6" fill="#5b9dff"/></marker></defs><rect width="1240" height="660" rx="18" fill="#0a0e18"/><g font-family="Arial,sans-serif"><text x="40" y="48" fill="#5b9dff" font-size="17">ENGINEERING EXPLANATION</text><text x="40" y="91" fill="#f5f7fb" font-size="29">Fresnel geometry: evaluate clearance at each obstacle</text><path d="M115 420 L115 220 M1100 420 L1100 220" stroke="#b7c0d4" stroke-width="8"/><path d="M115 235 H1100" stroke="#5b9dff" stroke-width="3"/><ellipse cx="607" cy="235" rx="492" ry="108" fill="#5b9dff" fill-opacity=".08" stroke="#c084fc" stroke-width="3"/><path d="M50 455 L280 430 L430 345 L530 410 L720 360 L860 435 L1190 455" fill="none" stroke="#fbbf24" stroke-width="4"/><path d="M607 235 V343" stroke="#c084fc" stroke-width="2" stroke-dasharray="7 5"/><text x="60" y="196" fill="#f5f7fb" font-size="22">Endpoint A</text><text x="1020" y="196" fill="#f5f7fb" font-size="22">Endpoint B</text><text x="650" y="294" fill="#c084fc" font-size="25">r1</text><text x="235" y="393" fill="#fbbf24" font-size="20">Terrain / obstacle profile</text><text x="70" y="505" fill="#f5f7fb" font-size="24">r1 = √(λ d1 d2 / (d1 + d2)) · all distances in metres</text><text x="70" y="550" fill="#b7c0d4" font-size="22">Example: 2 km at 5 GHz → midpoint r1 ≈ 5.48 m; 60% ≈ 3.29 m</text><text x="70" y="582" fill="#b7c0d4" font-size="18">Geometry not to scale. Refraction / Earth curvature require stated site assumptions.</text><text x="40" y="624" fill="#b7c0d4" font-size="17">Authored documentation visual · Illustrative review model, not original implementation evidence</text></g></svg>