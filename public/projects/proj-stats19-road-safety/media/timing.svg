<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 600" role="img" aria-labelledby="title"><title id="title">Leading national weekday and hour by year</title><rect width="1280" height="600" fill="#101923"/><g font-family="system-ui,sans-serif"><text x="55" y="80" fill="#fff" font-size="47" font-weight="750">Every annual peak fell on a weekday afternoon</text><text x="55" y="133" fill="#bed2e2" font-size="29" font-weight="500">Rank-one weekday and hour for each year</text><rect x="55" y="199" width="218" height="225" rx="7" fill="#182635"/><text x="77" y="254" fill="#83d5ca" font-size="32" font-weight="700">2021</text><text x="77" y="325" fill="#fff" font-size="28" font-weight="700">Friday</text><text x="77" y="376" fill="#f6bf77" font-size="31" font-weight="650">15:00</text><rect x="293" y="199" width="218" height="225" rx="7" fill="#182635"/><text x="315" y="254" fill="#83d5ca" font-size="32" font-weight="700">2022</text><text x="315" y="325" fill="#fff" font-size="28" font-weight="700">Thursday</text><text x="315" y="376" fill="#f6bf77" font-size="31" font-weight="650">17:00</text><rect x="531" y="199" width="218" height="225" rx="7" fill="#182635"/><text x="553" y="254" fill="#83d5ca" font-size="32" font-weight="700">2023</text><text x="553" y="325" fill="#fff" font-size="28" font-weight="700">Wednesday</text><text x="553" y="376" fill="#f6bf77" font-size="31" font-weight="650">17:00</text><rect x="769" y="199" width="218" height="225" rx="7" fill="#182635"/><text x="791" y="254" fill="#83d5ca" font-size="32" font-weight="700">2024</text><text x="791" y="325" fill="#fff" font-size="28" font-weight="700">Friday</text><text x="791" y="376" fill="#f6bf77" font-size="31" font-weight="650">15:00</text><rect x="1007" y="199" width="218" height="225" rx="7" fill="#182635"/><text x="1029" y="254" fill="#83d5ca" font-size="32" font-weight="700">2025</text><text x="1029" y="325" fill="#fff" font-size="28" font-weight="700">Friday</text><text x="1029" y="376" fill="#f6bf77" font-size="31" font-weight="650">15:00</text><text x="55" y="489" fill="#bed2e2" font-size="26" font-weight="500">Hour labels mark the start of a one-hour interval.</text><text x="55" y="544" fill="#eef3f8" font-size="26" font-weight="500">Across all years combined: Friday 15:00 ≈1,787 · Friday 16:00 ≈1,767.</text></g></svg>
