<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 405" role="img" aria-labelledby="title"><title id="title">Analysis workflow</title><rect width="1280" height="405" fill="#101923"/><g font-family="system-ui,sans-serif"><text x="55" y="78" fill="#fff" font-size="49" font-weight="750">From collision records to a local investigation</text><rect x="55" y="145" width="276" height="205" rx="7" fill="#182635"/><text x="76" y="203" fill="#83d5ca" font-size="32" font-weight="700">STATS19</text><text x="76" y="256" fill="#eef3f8" font-size="21" font-weight="500">Confirm scope and</text><text x="76" y="293" fill="#eef3f8" font-size="21" font-weight="500">distinct collision IDs</text><path d="M333 248h25m-8-7 8 7-8 7" stroke="#f6bf77" stroke-width="3" fill="none"/><rect x="360" y="145" width="276" height="205" rx="7" fill="#182635"/><text x="381" y="203" fill="#83d5ca" font-size="32" font-weight="700">Measures</text><text x="381" y="256" fill="#eef3f8" font-size="21" font-weight="500">Preserve decimals</text><text x="381" y="293" fill="#eef3f8" font-size="21" font-weight="500">Aggregate before rounding</text><path d="M638 248h25m-8-7 8 7-8 7" stroke="#f6bf77" stroke-width="3" fill="none"/><rect x="665" y="145" width="276" height="205" rx="7" fill="#182635"/><text x="686" y="203" fill="#83d5ca" font-size="32" font-weight="700">Tableau</text><text x="686" y="256" fill="#eef3f8" font-size="21" font-weight="500">Build linked views</text><text x="686" y="293" fill="#eef3f8" font-size="21" font-weight="500">Check each annual rank</text><path d="M943 248h25m-8-7 8 7-8 7" stroke="#f6bf77" stroke-width="3" fill="none"/><rect x="970" y="145" width="276" height="205" rx="7" fill="#182635"/><text x="991" y="203" fill="#83d5ca" font-size="32" font-weight="700">Decision</text><text x="991" y="256" fill="#eef3f8" font-size="21" font-weight="500">Add local context</text><text x="991" y="293" fill="#eef3f8" font-size="21" font-weight="500">Review traffic exposure</text></g></svg>
