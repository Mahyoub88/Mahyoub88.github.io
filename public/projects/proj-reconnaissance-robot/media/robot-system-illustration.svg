<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" role="img"><title>Reconnaissance rover — component integration</title><desc>Documented sensing, mapping, control and reporting responsibilities</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10" fill="#5eead4"/></marker><pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#20334b" stroke-width=".5"/></pattern></defs><rect width="1440" height="900" fill="#091321"/><rect width="1440" height="900" fill="url(#grid)"/><text x="50" y="64" fill="#5eead4" font-family="Arial" font-size="15" letter-spacing="3">ENGINEERING SYSTEMS • MOHAMMED MAHYOUB</text><text x="50" y="112" fill="#f8fafc" font-family="Arial" font-size="32" font-weight="bold">Reconnaissance rover — component integration</text><text x="50" y="148" fill="#b7c9dd" font-family="Arial" font-size="18">Documented sensing, mapping, control and reporting responsibilities</text><rect x="50" y="210" width="320" height="140" rx="16" fill="#14263b" stroke="#5eead4" stroke-width="1.5"/><text x="70" y="244" fill="#5eead4" font-family="Arial" font-size="21" font-weight="bold">Mapping workstation</text><text x="70" y="276" fill="#d8e5f4" font-family="Arial" font-size="17">Linux + Kinect drivers</text><text x="70" y="301" fill="#d8e5f4" font-family="Arial" font-size="17">RTAB-Map • colour/depth</text><rect x="1070" y="210" width="320" height="140" rx="16" fill="#14263b" stroke="#5eead4" stroke-width="1.5"/><text x="1090" y="244" fill="#5eead4" font-family="Arial" font-size="21" font-weight="bold">Operator interface</text><text x="1090" y="276" fill="#d8e5f4" font-family="Arial" font-size="17">Touchscreen commands</text><text x="1090" y="301" fill="#d8e5f4" font-family="Arial" font-size="17">Separate command / data links</text><rect x="50" y="480" width="320" height="160" rx="16" fill="#14263b" stroke="#5eead4"