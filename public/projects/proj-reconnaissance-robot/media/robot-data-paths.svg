<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" role="img"><title>Reconnaissance rover — data and control paths</title><desc>Separate the 3D mapping path from the embedded control and telemetry interfaces</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10" fill="#5eead4"/></marker><pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#20334b" stroke-width=".5"/></pattern></defs><rect width="1440" height="900" fill="#091321"/><rect width="1440" height="900" fill="url(#grid)"/><text x="50" y="64" fill="#5eead4" font-family="Arial" font-size="15" letter-spacing="3">ENGINEERING SYSTEMS • MOHAMMED MAHYOUB</text><text x="50" y="112" fill="#f8fafc" font-family="Arial" font-size="32" font-weight="bold">Reconnaissance rover — data and control paths</text><text x="50" y="148" fill="#b7c9dd" font-family="Arial" font-size="18">Separate the 3D mapping path from the embedded control and telemetry interfaces</text><rect x="50" y="220" width="350" height="140" rx="16" fill="#14263b" stroke="#5eead4" stroke-width="1.5"/><text x="70" y="254" fill="#5eead4" font-family="Arial" font-size="21" font-weight="bold">3D mapping input</text><text x="70" y="286" fill="#d8e5f4" font-family="Arial" font-size="17">Kinect: colour + depth</text><text x="70" y="311" fill="#d8e5f4" font-family="Arial" font-size="17">Wired USB acquisition</text><rect x="540" y="220" width="350" height="140" rx="16" fill="#14263b" stroke="#5eead4" stroke-width="1.5"/><text x="560" y="254" fill="#5eead4" font-family="Arial" font-size="21" font-weight="bold">Mapping processing</text><text x="560" y="286" fill="#d8e5f4" font-family="Arial" font-size="17">Linux driver / build integration</text><text x="560" y="311" fill="#d8e5f4" font-family="Arial" font-size="17">RTAB-Map</text><rect x="1030" y="220" width="350" height="140" rx="16" fill="#14263b" stroke="#5eead4" stroke-width="1.5"/><text x="1050" y="254" fill="#5eead4" font-family="Arial" font-size="21" font-weight="bold">3D mapping output</text><text x="1050" y="286" fill="#d8e5f4" font-family="Arial" font-size="17">Scene representation</text><text x="1050" y="311" fill="#d8e5f4" font-family="Arial" font-size="17">Reviewable mapping artifacts</text><path d="M405 285L535 285" stroke="#5eead4" stroke-width="2.5"  fill="none" marker-end="url(#arrow)"/><path d="M895 285L1025 285" stroke="#5eead4" stroke-width="2.5"  fill="none" marker-end="url(#arrow)"/><rect x="50" y="455" width="350" height="140" rx="16" fill="#14263b" stroke="#5eead4" stroke-width="1.5"/><text x="70" y="489" fill="#5eead4" font-family="Arial" font-size="21" font-weight="bold">2D mapping input</text><text x="70" y="521" fill="#d8e5f4" font-family="Arial" font-size="17">Ultrasonic sensing</text><text x="70" y="546" fill="#d8e5f4" font-family="Arial" font-size="17">Separate from RGB-D data</text><rect x="540" y="455" width="350" height="140" rx="16" fill="#14263b" stroke="#5eead4" stroke-width="1.5"/><text x="560" y="489" fill="#5eead4" font-family="Arial" font-size="21" font-weight="bold">Control &amp; sensor channels</text><text x="560" y="521" fill="#d8e5f4" font-family="Arial" font-size="17">nRF commands • XBee sensing</text><text x="560" y="546" fill="#d8e5f4" font-family="Arial" font-size="17">Bluetooth mapping data</text><rect x="1030" y="455" width="350" height="140" rx="16" fill="#14263b" stroke="#5eead4" stroke-width="1.5"/><text x="1050" y="489" fill="#5eead4" font-family="Arial" font-size="21" font-weight="bold">Operator / reporting</text><text x="1050" y="521" fill="#d8e5f4" font-family="Arial" font-size="17">Touchscreen interaction</text><text x="1050" y="546" fill="#d8e5f4" font-family="Arial" font-size="17">GPS/GSM location reporting</text><path d="M405 520L535 520" stroke="#5eead4" stroke-width="2.5"  fill="none" marker-end="url(#arrow)"/><path d="M895 520L1025 520" stroke="#5eead4" stroke-width="2.5"  fill="none" marker-end="url(#arrow)"/><rect x="50" y="660" width="1330" height="130" rx="16" fill="#14263b" stroke="#5eead4" stroke-width="1.5"/><text x="70" y="694" fill="#5eead4" font-family="Arial" font-size="21" font-weight="bold">Engineering interpretation</text><text x="70" y="726" fill="#d8e5f4" font-family="Arial" font-size="17">Depth data stays on USB; do not infer that Bluetooth transports the Kinect depth stream.</text><text x="70" y="751" fill="#d8e5f4" font-family="Arial" font-size="17">This responsibility diagram does not prescribe undocumented electronics, software protocols or motor wiring.</text><path d="M50 826H1390" stroke="#36506c"/><text x="50" y="855" fill="#b7c9dd" font-family="Arial" font-size="16">Explanatory design based on documented scope • Illustration, not an installation photograph or measured result</text></svg>