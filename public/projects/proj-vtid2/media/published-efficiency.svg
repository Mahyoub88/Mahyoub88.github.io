<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 610" role="img" aria-labelledby="title desc"><title id="title">VTID2: efficient CNN computational cost relative to standard CNN</title><desc id="desc">The published summary reports 87.24 percent fewer parameters and 81.67 percent fewer MACs, with a 0.0150 reduction in mean Macro-F1. Bars show normalized computational cost, not accuracy.</desc><rect width="1040" height="610" rx="20" fill="#0b1626"/><g font-family="Arial,sans-serif"><text x="48" y="52" fill="#5eead4" font-size="15" letter-spacing="2">VTID2 · PUBLISHED RESEARCH SUMMARY</text><text x="48" y="98" fill="#f8fafc" font-size="30">Computational cost relative to Standard CNN</text><text x="48" y="160" fill="#dce7f4" font-size="20">Trainable parameters</text><text x="48" y="200" fill="#a9bbd2" font-size="16">Standard CNN</text><rect x="300" y="180" width="560" height="28" rx="5" fill="#426787"/><text x="886" y="202" fill="#dce7f4" font-size="18">100%</text><text x="48" y="248" fill="#a9bbd2" font-size="16">Efficient CNN</text><rect x="300" y="228" width="71.45599999999999" height="28" rx="5" fill="#5eead4"/><text x="391.456" y="250" fill="#5eead4" font-size="18">12.76%</text><text x="48" y="345" fill="#dce7f4" font-size="20">Multiply-accumulate operations</text><text x="48" y="385" fill="#a9bbd2" font-size="16">Standard CNN</text><rect x="300" y="365" width="560" height="28" rx="5" fill="#426787"/><text x="886" y="387" fill="#dce7f4" font-size="18">100%</text><text x="48" y="433" fill="#a9bbd2" font-size="16">Efficient CNN</text><rect x="300" y="413" width="102.648" height="28" rx="5" fill="#5eead4"/><text x="422.648" y="435" fill="#5eead4" font-size="18">18.33%</text><path d="M48 495H990" stroke="#344960"/><text x="48" y="535" fill="#dce7f4" font-size="18">Trade-off: mean Macro-F1 lower by 0.0150 in the reported comparison.</text><text x="48" y="574" fill="#a9bbd2" font-size="15">Derived from the public project summary. Normalized cost; no new experiment or accuracy estimate.</text></g></svg>