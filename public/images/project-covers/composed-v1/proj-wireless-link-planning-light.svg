<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" role="img" aria-labelledby="t d"><title id="t">Wireless link planning: coverage, Fresnel clearance and link budget</title><desc id="d">Composed engineering illustration: sector coverage from a site, a point-to-point path with line of sight and Fresnel zone clearance, and the link-budget relation Pr = Pt + Gt + Gr − L. Not a measured result.</desc>
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f4f8fd"/><stop offset="1" stop-color="#e3edf9"/></linearGradient>
<linearGradient id="gr" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#c5d6ea"/><stop offset="1" stop-color="#d8e4f3"/></linearGradient>
<radialGradient id="cv" cx="0" cy="1" r="1"><stop offset="0" stop-color="#0a8f6e" stop-opacity=".55"/><stop offset="1" stop-color="#0a8f6e" stop-opacity=".05"/></radialGradient>
<pattern id="g" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#0f223810" stroke-width="1"/></pattern>
<marker id="ar" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9z" fill="#4a617e"/></marker></defs>
<rect width="1280" height="720" fill="url(#bg)"/><rect width="1280" height="720" fill="url(#g)"/>
<g font-family="Inter,Segoe UI,Arial,sans-serif">
<text x="56" y="84" fill="#1b6fd6" font-size="20" font-weight="700" letter-spacing="3">NETWORK ENGINEERING · RF PLANNING</text>
<text x="56" y="146" fill="#0f2238" font-size="56" font-weight="800">WIRELESS LINK PLANNING</text>
<text x="56" y="188" fill="#4a617e" font-size="26">Coverage · Line of sight &amp; Fresnel clearance · Link budget</text>
