<g transform="translate(56 566)"><rect width="348" height="104" rx="16" fill="#ffffff" stroke="#b8c9de"/><circle cx="46" cy="52" r="22" fill="#1b6fd6"/><text x="46" y="60" text-anchor="middle" fill="#fff" font-size="22" font-weight="800">1</text><text x="86" y="46" fill="#0f2238" font-size="24" font-weight="800" letter-spacing="1">COVERAGE</text><text x="86" y="76" fill="#4a617e" font-size="17">Sectors · alignment</text></g><g transform="translate(466 566)"><rect width="348" height="104" rx="16" fill="#ffffff" stroke="#b8c9de"/><circle cx="46" cy="52" r="22" fill="#1b6fd6"/><text x="46" y="60" text-anchor="middle" fill="#fff" font-size="22" font-weight="800">2</text><text x="86" y="46" fill="#0f2238" font-size="24" font-weight="800" letter-spacing="1">FRESNEL</text><text x="86" y="76" fill="#4a617e" font-size="17">Path profile · clearance</text></g><g transform="translate(876 566)"><rect width="348" height="104" rx="16" fill="#ffffff" stroke="#b8c9de"/><circle cx="46" cy="52" r="22" fill="#1b6fd6"/><text x="46" y="60" text-anchor="middle" fill="#fff" font-size="22" font-weight="800">3</text><text x="86" y="46" fill="#0f2238" font-size="24" font-weight="800" letter-spacing="1">LINK BUDGET</text><text x="86" y="76" fill="#4a617e" font-size="17">Pt + Gt + Gr − L ≥ sensitivity</text></g>
