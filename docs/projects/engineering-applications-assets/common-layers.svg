<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" role="img" aria-labelledby="title desc"><title id="title">Shared implementation pattern</title><desc id="desc">A shared pattern does not imply the four applications currently share a runtime or database.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#67e8d0"/></marker></defs><rect width="960" height="600" rx="20" fill="#0b1220"/><g font-family="Arial,sans-serif"><text x="40" y="48" font-size="24" fill="#f8fafc">Shared implementation pattern</text><text x="40" y="78" font-size="14" fill="#a9bdd3">PROPOSED DESIGN · Not recovered application source</text><path d="M450 150 H492" fill="none" stroke="#67e8d0" stroke-width="2" marker-end="url(#arrow)"/><path d="M705 200 V225 H245 V242" fill="none" stroke="#67e8d0" stroke-width="2" marker-end="url(#arrow)"/><path d="M705 200 V242" fill="none" stroke="#67e8d0" stroke-width="2" marker-end="url(#arrow)"/><path d="M705 350 V375 H245 V392" fill="none" stroke="#67e8d0" stroke-width="2" marker-end="url(#arrow)"/><path d="M245 350 V375 H705 V392" fill="none" stroke="#67e8d0" stroke-width="2" marker-end="url(#arrow)"/><rect x="40" y="100" width="410" height="100" rx="12" fill="#172c43" stroke="#52718a"/><text x="58" y="136" font-size="19" fill="#67e8d0">Desktop interface</text><text x="58" y="170" font-size="14" fill="#d7e3f3">Presentation and user input</text><rect x="500" y="100" width="410" height="100" rx="12" fill="#172c43" stroke="#52718a"/><text x="518" y="136" font-size="19" fill="#67e8d0">Application services</text><text x="518" y="170" font-size="14" fill="#d7e3f3">Orchestrate each use case</text><rect x="40" y="250" width="410" height="100" rx="12" fill="#172c43" stroke="#52718a"/><text x="58" y="286" font-size="19" fill="#67e8d0">Domain rules / Calculations</text><text x="58" y="320" font-size="14" fill="#d7e3f3">Independent, verifiable logic</text><rect x="500" y="250" width="410" height="100" rx="12" fill="#172c43" stroke="#52718a"/><text x="518" y="286" font-size="19" fill="#67e8d0">Data and device interfaces</text><text x="518" y="320" font-size="14" fill="#d7e3f3">Explicit integration boundaries</text><rect x="40" y="400" width="410" height="100" rx="12" fill="#172c43" stroke="#52718a"/><text x="58" y="436" font-size="19" fill="#67e8d0">Persistence / Adapters</text><text x="58" y="470" font-size="14" fill="#d7e3f3">Database or external observations</text><rect x="500" y="400" width="410" height="100" rx="12" fill="#172c43" stroke="#52718a"/><text x="518" y="436" font-size="19" fill="#67e8d0">Reports and exports</text><text x="518" y="470" font-size="14" fill="#d7e3f3">Inputs, assumptions and results</text><text x="40" y="580" font-size="13" fill="#a9bdd3">A shared pattern does not imply the four applications currently share a runtime or database.</text></g></svg>