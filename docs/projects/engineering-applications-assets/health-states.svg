<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" role="img" aria-labelledby="title desc"><title id="title">Observation freshness and health</title><desc id="desc">Condition and freshness are separate. Transition rules and persistence thresholds require explicit configuration.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#67e8d0"/></marker></defs><rect width="960" height="600" rx="20" fill="#0b1220"/><g font-family="Arial,sans-serif"><text x="40" y="48" font-size="24" fill="#f8fafc">Observation freshness and health</text><text x="40" y="78" font-size="14" fill="#a9bdd3">PROPOSED DESIGN · Not recovered application source</text><path d="M450 150 H492" fill="none" stroke="#67e8d0" stroke-width="2" marker-end="url(#arrow)"/><path d="M705 200 V225 H245 V242" fill="none" stroke="#67e8d0" stroke-width="2" marker-end="url(#arrow)"/><path d="M450 300 H492" fill="none" stroke="#67e8d0" stroke-width="2" marker-end="url(#arrow)"/><path d="M705 200 V225 H245 V392" fill="none" stroke="#67e8d0" stroke-width="2" marker-end="url(#arrow)"/><path d="M705 350 V375 H245 V392" fill="none" stroke="#67e8d0" stroke-width="2" marker-end="url(#arrow)"/><path d="M450 450 H492" fill="none" stroke="#67e8d0" stroke-width="2" marker-end="url(#arrow)"/><rect x="40" y="100" width="410" height="100" rx="12" fill="#172c43" stroke="#52718a"/><text x="58" y="136" font-size="19" fill="#67e8d0">Unknown</text><text x="58" y="170" font-size="14" fill="#d7e3f3">No reliable observation available</text><rect x="500" y="100" width="410" height="100" rx="12" fill="#172c43" stroke="#52718a"/><text x="518" y="136" font-size="19" fill="#67e8d0">Healthy</text><text x="518" y="170" font-size="14" fill="#d7e3f3">Fresh observation meets health rules</text><rect x="40" y="250" width="410" height="100" rx="12" fill="#172c43" stroke="#52718a"/><text x="58" y="286" font-size="19" fill="#67e8d0">Warning</text><text x="58" y="320" font-size="14" fill="#d7e3f3">Warning limit exceeded</text><rect x="500" y="250" width="410" height="100" rx="12" fill="#172c43" stroke="#52718a"/><text x="518" y="286" font-size="19" fill="#67e8d0">Critical</text><text x="518" y="320" font-size="14" fill="#d7e3f3">Critical limit persistently exceeded</text><rect x="40" y="400" width="410" height="100" rx="12" fill="#172c43" stroke="#52718a"/><text x="58" y="436" font-size="19" fill="#67e8d0">Stale</text><text x="58" y="470" font-size="14" fill="#d7e3f3">Observation has expired</text><rect x="500" y="400" width="410" height="100" rx="12" fill="#172c43" stroke="#52718a"/><text x="518" y="436" font-size="19" fill="#67e8d0">Recovery</text><text x="518" y="470" font-size="14" fill="#d7e3f3">Re-evaluate after a stable fresh reading</text><text x="40" y="580" font-size="13" fill="#a9bdd3">Condition and freshness are separate. Transition rules and persistence thresholds require explicit configuration.</text></g></svg>